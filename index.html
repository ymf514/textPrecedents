<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Before the Joke Arrives</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Ma+Shan+Zheng&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-mask"></div>
    <div class="hero-text">
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-line" id="hero-line"></p>
    </div>
  </header>

  <main class="essay" id="essay">
    <article class="text-col" id="text-col"></article>
    <aside class="note-col" id="note-col"></aside>
  </main>

  <section class="excerpts">
    <div class="excerpts-inner" id="excerpts"></div>
  </section>

  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <div class="modal-bar">
        <a id="modal-open" target="_blank" rel="noopener">Open in new tab ↗</a>
        <button id="modal-close" aria-label="Close">✕</button>
      </div>
      <iframe id="modal-frame" title="Source"></iframe>
      <img id="modal-img" alt="" hidden>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="content.js"></script>
  <script src="main.js"></script>
  <script src="sticky.js"></script>
</body>
</html>
